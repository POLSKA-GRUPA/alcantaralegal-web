server {
    listen 80;
    listen [::]:80;
    server_name www.alcantaralegal.es;

    # www no es canónico: el dominio canónico es el apex (CNAME de GitHub Pages)
    return 308 https://alcantaralegal.es$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name alcantaralegal.es localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Basic caching for assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
